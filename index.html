<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" type="text/css">
    <title>FindMyTicket!</title>
</head>
<body>
<section>
    <header class="page-header">
        <h1>FindMyTicket!</h1>
        <nav>
            <ul>
                <li><a href="cart.html"><img src="./icons/shopping-cart.png" title="smart cart icons" width="50px" height="50px"></a></li>
                <li><a href="account.html"><img src="./icons/account.png" title="account" width="50px" height="50px"></a></li>
            </ul>
        </nav>
    </header>
</section>
<section>
    <div class="search">
        <form action="">
            <input type="text" placeholder="Search for an event, artist, or venue">
            <button type="submit">Search</button>
        </form>
    </div>
</section>
<section class="columns-section">
    <div class="column">
        <h2>Shows near you</h2>
        <div class="show-item">
            <h3>Cincinnati Reds Game</h3>
            <p>Opening night at the ballpark — great seats, live action, and the fan experience.</p>
            <button type="button" class="add-to-cart" data-item="Cincinnati Reds Game">Buy Tickets</button>
        </div>
    </div>
    <div class="column">
        <h2>Recommendations</h2>
        <div class="show-item">
            <h3>Charli XCX</h3>
            <p>Come see Charli XCX live in Chicago!</p>
            <button type="button" class="add-to-cart" data-item="Charli XCX">Buy Tickets</button>
        </div>
    </div>
</section>
<script src="script.js"></script>
</body>
</html>
